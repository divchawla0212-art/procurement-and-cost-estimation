name: procurement

services:
  # FastAPI + the compiled React UI on one origin. The single service: setup,
  # ingestion and review all go through it.
  api:
    build:
      context: .
    image: procurement-review:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PROCUREMENT_PROJECTS_ROOT: /data/projects
    volumes:
      - projects:/data/projects
    restart: unless-stopped

volumes:
  # Authoritative snapshot store. Persisting this across rebuilds is not
  # optional — projects/<slug>/store/ is the system of record.
  projects:
