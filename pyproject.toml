[project]
name = "cost-estimation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "openpyxl>=3.1", "pyyaml>=6.0", "anthropic>=0.39"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cost-est = "cost_estimation.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
