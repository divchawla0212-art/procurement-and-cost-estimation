[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-estimation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "openpyxl>=3.1", "pyyaml>=6.0", "anthropic>=0.39", "pypdf>=4.0", "python-docx>=1.1", "python-dotenv>=1.0", "openai>=1.0", "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Only tools/parser_ab.py needs this, and only when the llamaparse arm runs.
# Deliberately not a core dependency: CI installs the core set and must stay
# key-free, and a hosted parser in that set would put a network service on the
# critical path of every checkout. `llama-parse` and `llama-cloud-services` are
# both deprecated -- the latter's maintenance ended 2026-05-01.
llamaparse = ["llama-cloud>=1.0"]

[project.scripts]
cost-est = "cost_estimation.cli:main"

# Flat layout: name the real packages so setuptools doesn't try to package
# runtime/data dirs (data/, projects/, docs/) alongside them.
[tool.setuptools.packages.find]
include = ["cost_estimation*", "procurement*", "shared*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
