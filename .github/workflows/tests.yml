# Test suite gate for pull requests into main.
#
# No ANTHROPIC_API_KEY (or any other provider secret) is configured here, and
# that is deliberate. The suite is key-free by design — it runs against
# shared/llm/mock_client.py — so CI needs no secret to be meaningful. Supplying
# one would convert the skip-guarded live tests into billed API calls on every
# pull request, put network flakiness in the merge gate, and widen the key's
# blast radius to fork PRs. The trade is stated plainly: the live-provider paths
# are not exercised here.
#
# Expected on a clean checkout: 1058 passed, 10 skipped, 0 failed. See the
# "Running things" section of CLAUDE.md for the arithmetic behind that number
# and how it relates to the workstation baseline.
#
# Ten skips are expected, not a defect: three need provider credentials, seven
# need untracked fixture directories (`data/`, and the multi-vendor `projects/`
# corpus) that are not tracked in git.
#
# The `web` job below takes no secrets either, and is not part of the pytest
# counts above — it is a separate suite over `web/`.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # 3.12 is the requires-python floor in pyproject.toml. There is no version
      # matrix on purpose: nothing consumes this repo as a library, so the only
      # interpreter that matters is the one the code targets.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      # 22 matches the node:22-alpine base image in the Dockerfile — the same
      # rationale as the Python job pinning to the pyproject.toml floor: build
      # and test against the interpreter the shipped image actually runs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # web/tsconfig.app.json includes `src`, so *.test.tsx files are
      # type-checked as part of the production build, not just by vitest.
      # Running only `npm test` here would miss a test-file type error that
      # `npm run build` catches — see task 5's carry-forward note in
      # .superpowers/sdd/2026-08-05-tracked-bugs-001-004/progress.md.
      - name: Build
        run: npm run build
